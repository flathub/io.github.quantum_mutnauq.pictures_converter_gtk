app-id: io.github.quantum_mutnauq.pictures_converter_gtk
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: pictures-converter
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
  - --filesystem=xdg-pictures

cleanup:
  - '/share/info'
  - '/include'
  - '/share/man'
  
modules:
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_LIBOPENJPEG=openjpeg2
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/poppler/poppler.git
        commit: 82301134e41c86b4d65f652020c0059081211f38
        tag: poppler-26.11.0
    cleanup:
       - '/bin'

  - name: libconfig
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/hyperrealm/libconfig.git
        commit: a211339ea575bb1253e3e24eee47089249f6bda1
        tag: v1.8.3
      - type: shell
        commands:
          - autoreconf -i

  - name: PicturesConverter
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFLATPAK_BUILD=ON
      - -DFLATPAK_ID=io.github.quantum_mutnauq.pictures_converter_gtk
    sources:
      - type: git
        url: https://github.com/Quantum-mutnauQ/pictures_converter_gtk.git
        commit: 70fc484e4127647fdb1685f37f3fe2fc4a8dce51
        tag: v1.6
